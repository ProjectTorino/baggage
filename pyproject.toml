[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baggage"
version = "0.1.0"
description = "Find the files that are actually costing you money. Zero-config change-cost analysis from git history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "technical-debt", "churn", "code-review", "cli", "hotspots"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
baggage = "baggage.cli:main"

[project.urls]
Homepage = "https://github.com/Torino-Official/baggage"

[tool.setuptools.packages.find]
include = ["baggage*"]

[tool.ruff]
line-length = 100
target-version = "py39"
